---
# Map system architecture to Docker apt architecture names.
docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf

# User to add to the docker group (empty string = skip).
xui_admin_user: pilot

# ── First-run bootstrap (root -> admin user) ─────────────────────────────────
# If enabled, playbook creates xui_admin_user, grants sudo and can copy
# /root/.ssh/authorized_keys to the new user.
xui_bootstrap_admin_user: true
xui_bootstrap_sudo_nopasswd: true
xui_bootstrap_copy_root_authorized_keys: true

# ── Deployment mode ────────────────────────────────────────────────────────────
# basic:        3x-ui exposes panel directly; VLESS on port 443 (network_mode: host).
# nginx_simple: Nginx terminates TLS for the panel on 443; Xray is exposed on
#               xui_xray_backend_port (8443) — straightforward, weaker masquerade.
# nginx_sni:    Nginx SNI router on 443 routes panel and Xray by domain name;
#               both are bound only to localhost — maximum masquerade.
xui_mode: nginx_sni

# ── Ports ──────────────────────────────────────────────────────────────────────
xui_ssh_port: 1337
xui_panel_port: 2053           # panel internal port inside container (all modes)
xui_sub_port: 2096             # subscription backend port inside container
xui_vless_port: 443            # Xray external port (basic mode only)
xui_xray_backend_port: 8443    # Xray local port  (nginx_simple / nginx_sni)
xui_nginx_http_backend_port: 4443  # nginx-http local port for TLS termination (nginx_sni)

# ── SSH hardening ──────────────────────────────────────────────────────────────
# WARNING: enable only after SSH key-based access is confirmed!
xui_manage_ssh_hardening: false
xui_disable_password_auth: true

# ── Container ──────────────────────────────────────────────────────────────────
xui_image: ghcr.io/mhsanaei/3x-ui:latest
xui_enable_fail2ban: true

# ── Domain and TLS (nginx modes only) ─────────────────────────────────────────
xui_panel_domain: ""    # panel domain, e.g. panel.example.com
xui_vpn_domain: www.samsung.com # VPN domain for SNI routing (nginx_sni only),
                              # e.g. vpn.example.com
xui_panel_path: "/"     # URL path prefix for the panel web UI

# ── TLS certificate ────────────────────────────────────────────────────────────
# false = generate a self-signed certificate automatically
xui_use_letsencrypt: true
xui_certbot_email: zorgzerg@gmail.com   # required when xui_use_letsencrypt: true
xui_acme_webroot: /var/www/certbot      # webroot for HTTP-01 challenge

# ── SNI cover backend (nginx_sni only) ────────────────────────────────────────
# Unknown SNI → proxied to this real site (masquerade at the nginx level).
xui_sni_cover_backend: "www.samsung.com:443"
xui_nginx_stream_map_hash_bucket_size: 128

# ── Optional Hysteria2 (separate from Reality) ───────────────────────────────
# Hysteria2 uses UDP (QUIC). It cannot be combined with TCP+Reality in one inbound.
xui_hysteria_enabled: true
xui_hysteria_port: 443
xui_hysteria_domain: ""    # set per host in inventory.ini (gitignored)

